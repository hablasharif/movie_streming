<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXUS STREAM · HYBRID PLAYER</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05070a; --surface:#0c0f14; --card:#11161d; --border:#1e2a36;
  --cyan:#00e5ff; --cyan-glow:rgba(0,229,255,0.12); --green:#1afa8c;
  --red:#ff4f4f; --yellow:#fbbf24; --purple:#a78bfa; --text:#eef2ff;
  --muted:#6b7c93; --mono:'Inter', monospace; --display:'Syne',sans-serif;
  --radius:18px; --radius-sm:10px; --transition:0.2s cubic-bezier(0.2,0.9,0.4,1.1);
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:9px}
.glow-text{background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
/* header */
.header{position:sticky;top:0;z-index:100;backdrop-filter:blur(24px);background:rgba(5,7,10,0.85);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.logo{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-0.02em}
.logo span{color:var(--cyan)}.logo small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.search-area{flex:1;max-width:520px;display:flex;gap:8px}
.search-area input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:60px;padding:12px 18px;color:var(--text);font-size:14px;outline:none;transition:all var(--transition)}
.search-area input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-glow)}
.search-area button{background:var(--cyan);border:none;border-radius:60px;padding:0 24px;font-weight:700;color:#05070a;cursor:pointer;transition:0.15s}
.search-area button:hover{opacity:0.85;transform:scale(0.97)}
.mode-switch{display:flex;gap:8px;background:var(--surface);padding:4px;border-radius:48px;border:1px solid var(--border)}
.mode-btn{background:transparent;border:none;padding:6px 18px;border-radius:48px;color:var(--muted);font-weight:600;cursor:pointer;transition:all 0.15s}
.mode-btn.active{background:var(--cyan);color:#05070a;box-shadow:0 4px 12px rgba(0,229,255,0.3)}
.proxy-badge{background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.3);border-radius:60px;padding:6px 14px;font-size:12px;font-family:var(--mono);cursor:pointer;transition:0.1s}
.proxy-badge:hover{border-color:var(--cyan)}
/* layout */
.app{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:24px;max-width:1600px;margin:0 auto}
@media(max-width:880px){.app{grid-template-columns:1fr;padding:16px}}
.player-col{display:flex;flex-direction:column;gap:16px}
.video-container{background:#000;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);position:relative}
.video-wrapper{position:relative;padding-bottom:56.25%;background:#000}
#videoPlayer{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
.controls-bar{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctrl-group{display:flex;gap:6px;align-items:center}
.toggle-switch{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:32px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.1s}
.toggle-switch.active{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-glow)}
.servers-bar{background:var(--surface);border-radius:var(--radius-sm);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--border)}
.servers-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.server-tab{background:var(--card);border:1px solid var(--border);border-radius:30px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.1s;display:flex;align-items:center;gap:6px}
.server-tab.active{border-color:var(--cyan);background:var(--cyan-glow);color:var(--cyan)}
.server-tab i{font-size:12px}
.info-panel{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.info-header{padding:16px;border-bottom:1px solid var(--border);display:flex;gap:16px}
.poster-img{width:70px;height:105px;object-fit:cover;border-radius:12px;background:var(--card)}
.info-details{flex:1}
.info-details h3{font-size:18px;font-weight:700;margin-bottom:6px}
.meta-badge{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.badge{background:var(--card);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:500}
.episode-panel{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-top:16px;padding:16px}
.episode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;max-height:240px;overflow-y:auto;margin-top:12px}
.ep-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:0.08s}
.ep-btn.active{background:var(--cyan);color:#05070a;border-color:var(--cyan)}
.recommend-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.rec-item{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:8px;cursor:pointer;border:1px solid var(--border);transition:0.1s}
.rec-item:hover{border-color:var(--cyan);transform:translateX(4px)}
.rec-img{width:42px;height:63px;object-fit:cover;border-radius:8px}
.rec-info h4{font-size:13px;font-weight:600}
.rec-info p{font-size:10px;color:var(--muted)}
.log-area{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-top:16px;padding:12px;max-height:200px;overflow-y:auto;font-size:11px;font-family:monospace}
.log-entry{padding:4px 0;border-bottom:1px solid var(--border);color:var(--muted)}
.log-entry.info{color:var(--cyan)}.log-entry.ok{color:var(--green)}.log-entry.err{color:var(--red)}
.loader-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:20;backdrop-filter:blur(8px);border-radius:var(--radius)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border-left:3px solid var(--cyan);padding:12px 20px;border-radius:12px;z-index:999;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.4);animation:fadeIn 0.2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}}
.hidden{display:none}
</style>
</head>
<body>

<div class="header">
  <div class="logo">NEXUS<span>STREAM</span><small> · hybrid player</small></div>
  <div class="search-area">
    <input type="text" id="globalSearch" placeholder="Search movies, TV shows, anime... (TMDB + Jikan)">
    <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
  </div>
  <div class="mode-switch">
    <button class="mode-btn active" data-mode="tmdb">🎬 Movies/TV</button>
    <button class="mode-btn" data-mode="anime">🍥 Anime (MAL)</button>
  </div>
  <div class="proxy-badge" id="proxyBadge"><i class="fas fa-shield-alt"></i> <span id="proxyLabel">foxy-doxy active</span></div>
</div>

<div class="app">
  <!-- LEFT: PLAYER COLUMN -->
  <div class="player-col">
    <div class="video-container">
      <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" controls playsinline crossorigin></video>
        <div id="loaderOverlay" class="loader-overlay hidden">
          <div class="spinner"></div>
          <span>resolving stream · proxy active</span>
        </div>
      </div>
      <div class="controls-bar">
        <div class="ctrl-group"><div class="toggle-switch" id="autoPlayToggle"><i class="fas fa-play-circle"></i> Autoplay</div></div>
        <div class="ctrl-group"><div class="toggle-switch" id="autoNextToggle"><i class="fas fa-forward-step"></i> AutoNext</div></div>
      </div>
      <div class="servers-bar" id="serversBar">
        <span class="servers-label"><i class="fas fa-server"></i> source</span>
        <!-- dynamic server tabs will be injected -->
      </div>
    </div>
    <div class="episode-panel" id="episodePanel" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center"><strong><i class="fas fa-list"></i> Episodes</strong><span id="episodeCount"></span></div>
      <div id="episodeGrid" class="episode-grid"></div>
    </div>
    <div class="log-area" id="logArea"><div class="log-entry sys">⚡ system ready · proxy fallback enabled</div></div>
  </div>

  <!-- RIGHT: INFO + RECOMMENDATIONS -->
  <div class="right-col">
    <div class="info-panel" id="infoPanel">
      <div class="info-header">
        <img id="detailPoster" class="poster-img" src="https://via.placeholder.com/70x105?text=cover" alt="">
        <div class="info-details">
          <h3 id="detailTitle">Select a title</h3>
          <div class="meta-badge" id="detailMeta"></div>
          <p id="detailOverview" style="font-size:12px;color:var(--muted);margin-top:8px">Search movies, series or anime. Streams will be fetched via dynamic servers + proxy routing.</p>
        </div>
      </div>
    </div>
    <div class="info-panel" style="margin-top:16px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700"><i class="fas fa-thumbs-up"></i> You might also like</div>
      <div id="recommendList" class="recommend-list" style="padding:8px"></div>
    </div>
  </div>
</div>

<script>
  // ======================== CONFIG ============================
  const TMDB_KEY = "6fad3f86b8452ee232deb7977d7dcf58";
  const TMDB_BASE = "https://api.themoviedb.org/3";
  const TMDB_IMG = "https://image.tmdb.org/t/p/w500";
  
  // PROXY CONFIG (from second code - foxy doxy & donka)
  const PROXY_LIST = {
    foxy: "https://foxy-doxy.andruilsyestems.workers.dev",
    donka: "https://donka-bonka-proxy.onrender.com"
  };
  let activeProxy = PROXY_LIST.foxy;
  let useProxy = true;
  
  // STREAM SERVERS (M3U8 / embed interceptors) - 5 main servers
  // For TMDB movies/tv: RiveStream style (download pages with m3u8 interception)
  // For Anime: MegaPlay / VidWish style (MAL endpoints)
  const TMDB_SERVERS = [
    { id: "rivestream", label: "🎬 RiveStream", icon: "🌊", buildUrl: (type, id, season, ep) => `https://rivestream.ru/download?type=${type}&id=${id}${type==='tv'?`&season=${season}&episode=${ep}`:''}` },
    { id: "megadrive", label: "📀 MegaPlay", icon: "⚡", buildUrl: (type, id, season, ep) => `https://megaplay.buzz/stream/tmdb/${id}/${type==='tv'?`${season}/${ep}`:'movie'}` },
    { id: "hydrax", label: "💧 HydraX", icon: "🌀", buildUrl: (type, id, season, ep) => `https://playhydrax.com/embed/${type}/${id}${type==='tv'?`/${season}/${ep}`:''}` },
    { id: "vidlink", label: "🔗 VidLink", icon: "🔗", buildUrl: (type, id, season, ep) => `https://vidlink.pro/e/${type}/${id}${type==='tv'?`/${season}/${ep}`:''}` },
    { id: "rapidcdn", label: "⚡ RapidShare", icon: "🚀", buildUrl: (type, id, season, ep) => `https://rapidshare.cx/embed/${type}/${id}${type==='tv'?`/${season}/${ep}`:''}` }
  ];
  
  const ANIME_SERVERS = [
    { id: "mp-sub", label: "🍥 MegaPlay SUB", icon: "🇯🇵", buildUrl: (malId, ep) => `https://megaplay.buzz/stream/mal/${malId}/${ep}/sub` },
    { id: "mp-dub", label: "🎙️ MegaPlay DUB", icon: "🇺🇸", buildUrl: (malId, ep) => `https://megaplay.buzz/stream/mal/${malId}/${ep}/dub` },
    { id: "vw-sub", label: "📺 VidWish SUB", icon: "🎌", buildUrl: (malId, ep) => `https://vidwish.live/stream/mal/${malId}/${ep}/sub` },
    { id: "vw-dub", label: "🔊 VidWish DUB", icon: "🌎", buildUrl: (malId, ep) => `https://vidwish.live/stream/mal/${malId}/${ep}/dub` },
    { id: "anifast", label: "⚡ AniFast", icon: "💨", buildUrl: (malId, ep) => `https://anifast.pro/embed/${malId}/${ep}` }
  ];
  
  // GLOBAL STATE
  let currentMode = "tmdb";     // "tmdb" or "anime"
  let currentContent = null;    // tmdb item or mal anime object
  let currentMediaType = "movie"; // movie/tv for tmdb
  let currentSeason = 1, currentEpisode = 1, totalEpisodes = 0;
  let currentMalId = null, currentAnimeData = null;
  let currentServerId = null;
  let hlsInstance = null;
  let autoPlay = true, autoNext = true;
  let nextCountdownTimer = null;
  let isPlayingEnded = false;
  
  // helper: toast
  function toast(msg, type="info"){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<i class="fas fa-${type==='ok'?'check-circle':'info-circle'}"></i> ${msg}`; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
  function log(msg, level="info"){ const logDiv=document.getElementById('logArea'); const entry=document.createElement('div'); entry.className=`log-entry ${level}`; entry.innerHTML=`[${new Date().toLocaleTimeString()}] ${msg}`; logDiv.appendChild(entry); entry.scrollIntoView({behavior:'smooth',block:'nearest'}); if(logDiv.children.length>50) logDiv.removeChild(logDiv.children[0]); }
  
  // PROXY URL builder (like second code)
  function buildProxiedUrl(originalUrl, headersObj = {}) {
    if(!useProxy) return originalUrl;
    const base = activeProxy;
    const encUrl = btoa(encodeURIComponent(originalUrl));
    let proxyUrl = `${base}/proxy?url=${encUrl}`;
    if(Object.keys(headersObj).length){
      const encHeaders = btoa(encodeURIComponent(JSON.stringify(headersObj)));
      proxyUrl += `&headers=${encHeaders}`;
    }
    return proxyUrl;
  }
  
  // Load stream via HLS.js or native
  function loadStreamIntoPlayer(streamUrl, customHeaders = {}) {
    const video = document.getElementById('videoPlayer');
    const loader = document.getElementById('loaderOverlay');
    loader.classList.remove('hidden');
    if(hlsInstance){ hlsInstance.destroy(); hlsInstance=null; }
    video.pause(); video.src = '';
    let finalUrl = streamUrl;
    if(useProxy && !streamUrl.startsWith('blob:')) finalUrl = buildProxiedUrl(streamUrl, customHeaders);
    log(`loading stream: ${finalUrl.substring(0,80)}...`, 'info');
    if (finalUrl.includes('.m3u8') && Hls.isSupported()) {
      hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: false });
      hlsInstance.loadSource(finalUrl);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { loader.classList.add('hidden'); if(autoPlay) video.play().catch(e=>log(`autoplay blocked: ${e}`, 'warn')); });
      hlsInstance.on(Hls.Events.ERROR, (_, data) => { if(data.fatal){ log(`HLS error: ${data.details}`, 'err'); loader.classList.add('hidden'); toast('Stream error, try next server','err'); } });
    } else if (finalUrl.match(/\.(mp4|webm)$/i) || video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = finalUrl;
      video.oncanplay = () => { loader.classList.add('hidden'); if(autoPlay) video.play().catch(e=>log(e.message,'warn')); };
      video.onerror = () => { loader.classList.add('hidden'); toast('Video load error','err'); };
    } else { loader.classList.add('hidden'); toast('Unsupported stream format','err'); }
    // episode ended detection for auto-next
    video.ontimeupdate = () => { if(video.duration && (video.duration - video.currentTime) < 1.2 && !video.paused && !isPlayingEnded){ isPlayingEnded=true; handleEpisodeEnded(); } };
    video.onplaying = () => { isPlayingEnded=false; };
  }
  
  function handleEpisodeEnded(){
    if(!autoNext) return;
    if(currentMode === 'tmdb' && currentMediaType === 'tv'){
      if(currentEpisode < totalEpisodes){
        toast(`AutoNext: Episode ${currentEpisode+1} in 3s`, 'ok');
        setTimeout(()=>{ currentEpisode++; updateEpisodeUI(); playCurrentStream(); }, 3000);
      } else toast('Final episode reached', 'info');
    }
    else if(currentMode === 'anime' && currentAnimeData && currentEpisode < (currentAnimeData.episodes||999)){
      toast(`AutoNext: Ep ${currentEpisode+1} soon`, 'ok');
      setTimeout(()=>{ currentEpisode++; updateEpisodeUI(); playCurrentAnimeStream(); },3000);
    }
  }
  
  // TMDB: fetch seasons & episodes
  async function fetchTmdbEpisodes(tvId, seasonNum){
    try{
      const res = await fetch(`${TMDB_BASE}/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_KEY}`);
      const data = await res.json();
      const eps = data.episodes || [];
      totalEpisodes = eps.length;
      document.getElementById('episodeCount').innerText = `${totalEpisodes} eps`;
      const grid = document.getElementById('episodeGrid'); grid.innerHTML='';
      eps.forEach(ep=>{
        const btn=document.createElement('div'); btn.className='ep-btn'; btn.innerText=ep.episode_number;
        if(ep.episode_number===currentEpisode) btn.classList.add('active');
        btn.onclick=()=>{ currentEpisode=ep.episode_number; updateEpisodeUI(); playCurrentStream(); };
        grid.appendChild(btn);
      });
      document.getElementById('episodePanel').style.display='block';
    }catch(e){ log('failed load episodes','err'); totalEpisodes=0; }
  }
  
  // render info panel for TMDB
  function renderTmdbInfo(item, type){
    const title = item.title || item.name;
    const poster = item.poster_path ? TMDB_IMG+item.poster_path : 'https://via.placeholder.com/70x105';
    const year = (item.release_date||item.first_air_date||'').slice(0,4);
    const rating = item.vote_average ? item.vote_average.toFixed(1) : '—';
    document.getElementById('detailTitle').innerHTML = title;
    document.getElementById('detailPoster').src = poster;
    document.getElementById('detailMeta').innerHTML = `<span class="badge">⭐ ${rating}</span><span class="badge">${type==='movie'?'Movie':'TV'}</span><span class="badge">${year}</span>`;
    document.getElementById('detailOverview').innerText = item.overview?.slice(0,220) || 'No description available.';
    if(type === 'tv') fetchTmdbEpisodes(item.id, currentSeason);
    else document.getElementById('episodePanel').style.display='none';
  }
  
  // play tmdb stream using selected server
  function playCurrentStream(){
    if(!currentContent) return;
    const server = TMDB_SERVERS.find(s=>s.id===currentServerId) || TMDB_SERVERS[0];
    let url = '';
    if(currentMediaType === 'movie') url = server.buildUrl('movie', currentContent.id, null, null);
    else url = server.buildUrl('tv', currentContent.id, currentSeason, currentEpisode);
    log(`🎬 ${server.label} · ${currentMediaType} ${currentMediaType==='tv'?`S${currentSeason}E${currentEpisode}`:''}`, 'info');
    loadStreamIntoPlayer(url, { Referer: 'https://rivestream.ru', Origin: 'https://rivestream.ru' });
  }
  
  // ANIME SECTION using Jikan API
  async function searchAnime(query){
    try{
      const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=24`);
      const data = await res.json();
      return data.data || [];
    }catch(e){ log('anime api error','err'); return []; }
  }
  async function fetchAnimeById(malId){
    const res = await fetch(`https://api.jikan.moe/v4/anime/${malId}`);
    const data = await res.json();
    return data.data;
  }
  function renderAnimeInfo(anime){
    const title = anime.title_english || anime.title;
    const poster = anime.images?.jpg?.large_image_url || 'https://via.placeholder.com/70x105';
    const score = anime.score || 'N/A';
    const episodes = anime.episodes || '?';
    document.getElementById('detailTitle').innerHTML = title;
    document.getElementById('detailPoster').src = poster;
    document.getElementById('detailMeta').innerHTML = `<span class="badge">⭐ ${score}</span><span class="badge">${episodes} eps</span><span class="badge">MAL #${anime.mal_id}</span>`;
    document.getElementById('detailOverview').innerText = (anime.synopsis || '').slice(0,240) || 'No synopsis.';
    if(episodes !== '?' && episodes>0){
      totalEpisodes = parseInt(episodes);
      document.getElementById('episodeCount').innerText = `${totalEpisodes} eps`;
      const grid = document.getElementById('episodeGrid'); grid.innerHTML='';
      for(let i=1;i<=Math.min(totalEpisodes,200);i++){
        const btn=document.createElement('div'); btn.className='ep-btn'; btn.innerText=i;
        if(i===currentEpisode) btn.classList.add('active');
        btn.onclick=()=>{ currentEpisode=i; updateEpisodeUI(); playCurrentAnimeStream(); };
        grid.appendChild(btn);
      }
      document.getElementById('episodePanel').style.display='block';
    } else document.getElementById('episodePanel').style.display='none';
  }
  function playCurrentAnimeStream(){
    if(!currentMalId) return;
    const server = ANIME_SERVERS.find(s=>s.id===currentServerId) || ANIME_SERVERS[0];
    const url = server.buildUrl(currentMalId, currentEpisode);
    log(`🍥 ${server.label} · Episode ${currentEpisode}`, 'ok');
    loadStreamIntoPlayer(url, { Referer: 'https://megaplay.buzz', Origin: 'https://megaplay.buzz' });
  }
  function updateEpisodeUI(){
    document.querySelectorAll('.ep-btn').forEach((btn,idx)=>{
      const epNum = parseInt(btn.innerText);
      if(epNum===currentEpisode) btn.classList.add('active'); else btn.classList.remove('active');
    });
  }
  
  // RENDER SEARCH RESULTS (grid modal style but we reuse right panel for cards list)
  function showSearchResults(items, type){
    const container = document.getElementById('recommendList');
    container.innerHTML = '';
    items.slice(0,12).forEach(item=>{
      const div = document.createElement('div'); div.className='rec-item';
      const img = document.createElement('img'); img.className='rec-img';
      img.src = item.poster_path ? TMDB_IMG+item.poster_path : (item.images?.jpg?.image_url || 'https://via.placeholder.com/42x63');
      img.onerror = ()=>img.src='https://via.placeholder.com/42x63';
      const infoDiv = document.createElement('div'); infoDiv.className='rec-info';
      const title = item.title || item.name || (item.title_english || item.title);
      infoDiv.innerHTML = `<h4>${title}</h4><p>${item.media_type === 'movie' ? 'Movie' : (item.media_type==='tv'?'TV':'Anime')}</p>`;
      div.appendChild(img); div.appendChild(infoDiv);
      div.onclick = async ()=>{
        if(type === 'tmdb'){
          currentContent = item; currentMediaType = item.media_type; currentSeason=1; currentEpisode=1;
          if(currentMediaType === 'movie') totalEpisodes=0;
          renderTmdbInfo(item, currentMediaType);
          if(currentMediaType === 'tv'){ await fetchTmdbEpisodes(item.id,1); }
          playCurrentStream();
        } else {
          const fullAnime = await fetchAnimeById(item.mal_id);
          if(fullAnime){
            currentAnimeData = fullAnime; currentMalId = fullAnime.mal_id; currentEpisode=1;
            renderAnimeInfo(fullAnime);
            playCurrentAnimeStream();
          }
        }
        toast(`loaded: ${title}`, 'ok');
      };
      container.appendChild(div);
    });
    if(!items.length) container.innerHTML = '<div style="padding:16px;color:var(--muted)">No results. try different keyword</div>';
  }
  
  // GLOBAL SEARCH handler
  async function handleSearch(){
    const query = document.getElementById('globalSearch').value.trim();
    if(!query) return toast('enter title', 'warn');
    log(`search: ${query} (mode: ${currentMode})`, 'info');
    if(currentMode === 'tmdb'){
      const movieRes = await fetch(`${TMDB_BASE}/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`);
      const data = await movieRes.json();
      const filtered = (data.results||[]).filter(r=>r.media_type==='movie'||r.media_type==='tv');
      showSearchResults(filtered, 'tmdb');
    } else {
      const animeList = await searchAnime(query);
      showSearchResults(animeList, 'anime');
    }
  }
  
  // BUILD SERVER TABS (dynamic)
  function buildServerTabs(){
    const bar = document.getElementById('serversBar');
    const servers = currentMode === 'tmdb' ? TMDB_SERVERS : ANIME_SERVERS;
    currentServerId = servers[0].id;
    bar.innerHTML = `<span class="servers-label"><i class="fas fa-server"></i> source</span>`;
    servers.forEach(srv=>{
      const btn = document.createElement('div'); btn.className = 'server-tab'; btn.innerHTML = `<i class="fas ${srv.icon==='🌊'?'fa-water':srv.icon==='⚡'?'fa-bolt':'fa-tv'}"></i> ${srv.label}`;
      if(srv.id === currentServerId) btn.classList.add('active');
      btn.onclick = ()=>{
        document.querySelectorAll('.server-tab').forEach(t=>t.classList.remove('active'));
        btn.classList.add('active'); currentServerId = srv.id;
        if(currentMode === 'tmdb' && currentContent) playCurrentStream();
        else if(currentMode === 'anime' && currentMalId) playCurrentAnimeStream();
        toast(`server: ${srv.label}`, 'info');
      };
      bar.appendChild(btn);
    });
  }
  
  // Mode switching & proxy badge
  function setMode(mode){
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.remove('active'));
    document.querySelector(`.mode-btn[data-mode="${mode}"]`).classList.add('active');
    buildServerTabs();
    if(mode === 'tmdb' && currentContent && currentContent.media_type) playCurrentStream();
    else if(mode === 'anime' && currentMalId) playCurrentAnimeStream();
    else toast(`Switched to ${mode==='tmdb'?'Movies/TV':'Anime'} mode. Search something!`,'info');
  }
  
  // proxy switcher (toggle between foxy and donka)
  function cycleProxy(){
    useProxy = true;
    if(activeProxy === PROXY_LIST.foxy) activeProxy = PROXY_LIST.donka;
    else activeProxy = PROXY_LIST.foxy;
    const label = activeProxy.includes('foxy') ? 'foxy-doxy' : 'donka-bonka';
    document.getElementById('proxyLabel').innerText = label;
    toast(`proxy: ${label}`, 'ok');
    log(`proxy changed → ${activeProxy}`, 'sys');
  }
  
  // toggles
  document.getElementById('autoPlayToggle').addEventListener('click', ()=>{ autoPlay=!autoPlay; document.getElementById('autoPlayToggle').classList.toggle('active',autoPlay); toast(`Autoplay ${autoPlay?'ON':'OFF'}`); });
  document.getElementById('autoNextToggle').addEventListener('click', ()=>{ autoNext=!autoNext; document.getElementById('autoNextToggle').classList.toggle('active',autoNext); toast(`AutoNext ${autoNext?'ON':'OFF'}`); });
  document.getElementById('proxyBadge').addEventListener('click', cycleProxy);
  document.getElementById('searchBtn').addEventListener('click', handleSearch);
  document.getElementById('globalSearch').addEventListener('keypress', e=>{if(e.key==='Enter') handleSearch();});
  
  // default: set server tabs & initial mode
  buildServerTabs();
  setMode('tmdb');
  autoPlay=true; autoNext=true;
  document.getElementById('autoPlayToggle').classList.add('active');
  document.getElementById('autoNextToggle').classList.add('active');
  log('HYBRID STREAM ENGINE · proxy active, m3u8 ready', 'ok');
</script>
</body>
</html>
